# Build settings
## Conversion
#markdown            : kramdown
#incremental         : false
#quiet               : false
#verbose             : false
#pygments: true
lsi:  false # don't produce an index for related posts
safe: false # disables plugins

kramdown:
  input: GFM
  auto_ids: false
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    span:
      disable: true
  entity_output: numeric
  smart_quotes: [apos, apos, quot, quot]
  typographic_symbols:
    ndash: --

mathjax: true
#highlighter: rouge
#highlighter: none
#quiet: false


# Gems
#whitelist           : []
#plugins             : []
plugins:
  - jekyll-archives
  - jekyll-feed                 # automatically generate an Atom feed at /feed.xml
  #- jekyll-html-pipeline
  #- jekyll-relative-links
  #- jekyll-redirect-from
  - jekyll-seo-tag
  #- jekyll-paginate
  - jekyll-sitemap
  - jemoji # allow emoji in your post
  #- rouge

relative_links:
  enabled:     true
  collections: false

#defaults            : []
defaults:
  - scope:
      path: '' # an empty string here means all files in the project
    values:
      layout: post
      #layout: page
      # types available are pages, posts, or any collection, in plural form
      type: posts
      # The 'post' type has become 'posts'.
      category: "journal"
      image: "/img/jekyll-og.png"
      #permalink: /:title/
  - scope:
      path: _note
      type: "notes"
    values:
      layout: page
      category: "ramblings"

  -
    scope:
      path: "projects"
      type: "pages" # previously `page`
    values:
      layout: "project" # overrides previous default layout
      author: "Mr. Poole"
  - scope:
      path: "img"
    values:
      image: true

#data_dir: /docs/_data
#collections_dir: docs
  - scope:
      path: _docs
      type: docs
    values:
      layout: article
      sharing: true
      category: post
      aside:
        toc: true
      show_edit_on_github: true
      show_subscribe: true
      pageview: true
      lightbox: true
  ## docs
  - scope:
      path: "_docs/en"
    values:
      layout: article
      nav_key: docs
      sidebar:
        nav: docs-en
      aside:
        toc: true
      show_edit_on_github: true
      show_date: false
      lightbox: true
  - scope:
      path: "_docs/zh"
    values:
      layout: article
      nav_key: docs
      sidebar:
        nav: docs-zh
      aside:
        toc: true
      lang: zh
      show_edit_on_github: true
      show_date: false
      lightbox: true
  #- scope:
      #path: '' # an empty string here means all files in the project
      #type: "notes" # a collection in your site, in plural form
    #values:
      #type: "notes" # a collection in your site, in plural form
      #image: "/img/jekyll-og.png"
  - scope:
      path: '' # an empty string here means all files in the project
    values:
      # so as not to add layout to each file
      layout: page
      type: pages
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "_note"
      type: "notes" # a collection in your site, in plural form
    values:
      layout: post
  - scope:
      path: "note"
      type: "notes" # a collection in your site, in plural form
    values:
      layout: post

collections:
  note:
    # Default is "/:path/", which is XXX
    #for collections, :collection is part of path
    # It's a must to explicitly set; the global setting cannot override the default
    #permalink: /:collection/:title/
    permalink: /:collection/:title/
    layout: post
    output: true
  posts:
    output: true
    permalink: /:slug
    #permalink: /:name
    #permalink: /:collection/:path/
    #output: true


highlight          : rouge
#include            : ['.htaccess']
include:
