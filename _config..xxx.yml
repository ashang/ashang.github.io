---
version: 4.2.2
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
name: in love we trust
title: wilt
subtitle: ramblings notes,
description: >- # this means to ignore newlines until "baseurl:"
 what i learnt today.
 things I worked through to make sure I understand.

#baseurl: "http://ashang.github.io/" # the subpath of your site, e.g. /blog
#url: "/" # the base hostname & protocol for your site
url:

#permalink: /:slug/
#permalink: /:path/
permalink: /:title/
# pages and collections (excluding posts and drafts) don’t have time
# and categories (for pages, the above :title is equivalent to :basename),
# these aspects of the permalink style are ignored for the output.

lang: "en"

#source: DIR

disable_disk_cache: true

# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
thepro:
  date_format: "%Y%m%d"
date_format: "ordinal"

# Gems
plugins:
- jekyll-feed                 # automatically generate an Atom feed at /feed.xml
- jekyll-seo-tag
- jekyll-sitemap
- jemoji
#- jekyll-github-metadata
#- rouge
#- jekyll-html-pipeline

#sass:
#  style: compressed
strict_front_matter: true

# Exclude from processing.
# exclude: [DIR, FILE, ...]
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.

#exclude: ["README.md"]
exclude:
  - CHANGELOG.md
  - HOW_TO_RELEASE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README-*.md
  - README.md
  - readme.md
  - gulpfile.js
  - package-lock.json
  - package.json
  - /docs
  - /node_modules
  - /screenshots
  - /test
  - /vendor

#####name: Aaron Shang
#email: Kea Wot <aaron@ashang.org>
#github_username: ashang
## flickr_username: jekyll
## linkedin_username: jekyll

#rss: rss
#rss: "feed.xml"
rss: "/feed.xml"

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
#header_pages:
# - about.md
# ########

collections:
  docs:
    permalink: "/:collection/:path/"
    output: true
  posts:
    permalink: "/:collection/:title/"
    #permalink: "/posts/:title/"
    #for posts, :title is part of path
    output: true
  note:
    # Default is "/:path/"
    #permalink: "/:path/"
    permalink: /drop/:path/
    output: true

# types available are pages, posts, drafts or any collection
defaults:
  - scope:
      path: _docs
      type: docs
    values:
      layout: docs

  - scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "default"

  - scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "_note"
      type: "drops" # a collection in your site, in plural form
    values:
      layout: post
      category: "ramblings"
  - scope:
      path: _posts
      # The 'post' type has become 'posts'.
      type: posts
    values:
      layout: post
      category: "journal"
  #- scope:
      #path: ''
    #values:
      #image: "/img/jekyll-og.png"

# Custom vars
# google_analytics_id: #UA-XXXX-Y
#google_site_verification: onQcXpAvtHBrUI5LlroHNE_FP0b2qvFyPq7VZw36iEY
#cloudinary_url: https://res.cloudinary.com/jekyll/image/upload/f_auto,q_auto,w_404
repository: https://github.com/jekyll/jekyll
timezone: America/Los_Angeles

future: true

# This can be in front matter of each markdown file
#mermaid: true

navs:
  -
    href: /
    label: DEN

  -
    href: /drop/
    label: DROP

  -
    href: /about/
    label: AMA

subscribe_rss: /feed.xml

#feed:
  #categories:
  #- release

favicon: "t.svg" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

theme_config:
  appearance: "dark" # can be "light", "dark" or "auto"
  #back_home_text: "$title" # customize text for homepage link in post layout
  date_format: "%Y%m%d" # customize how date is formatted
  #show_description: false # show blog description in home page
  show_description: false # show blog description in home page

#theme:
#theme: jekyll-theme-hacker
#ignore_theme_config: BOOL
# if you are using GitHub Pages, change it to remote_theme:

render_with_liquid: "false"
