---
layout: default
---
<main class="content fade-in-down delay-0_75s">
  <div class="inner">
    <article class="post">
      <div class="entry-box">
        <header class="entry-header">
          <h1 class="entry-title">{{ page.title }}</h1>
        </header><!-- .entry-header -->
        <div class="entry-content">
          {{content}}
        </div><!-- .entry-content -->
      </div><!-- .entry-box -->
    </article><!-- .post -->
  </div><!-- .inner -->
</main><!-- .content -->
