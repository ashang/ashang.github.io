# Build settings
#markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    default_lang: plaintext
#highlighter: rouge
# highlighter: none
#  syntax_highlighter: rouge
#quiet: false
#lsi: false
#auto_ids: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji

# Page default value
# defaults:
#   home:
#     heading: "Your awesome heading"
#     subheading: "Your awesome subheading"
#     banner: "Your image url"

# types available are pages, posts, drafts or any collection
#defaults            : []
defaults:
  - scope:
      path: '' # an empty string here means all files in the project
    values:
      # so as not to add layout to each file
      layout: post
      # types available are pages, posts, or any collection, in plural form
      type: posts
      # The 'post' type has become 'posts'.
      image: "/img/jekyll-og.png"
  -
    scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "_note"
      type: "notes" # a collection in your site, in plural form
    values:
      layout: post
  #- scope:
      #path: ''
    #values:
      #image: "/img/jekyll-og.png"

collections:
  note:
    # Default is "/:path/"
    #for collections, :collection is part of path
    # It's a must to explicitly set; the global setting cannot override the default
    permalink: /:collection/:title/
    layout: post
    output: true

