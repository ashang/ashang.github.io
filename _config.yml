defaults:
  # 全局默认（所有页面）
  - scope:
      path: "" # an empty string here means all files in the project
    values:
      #layout: "default"
      layout: post
  - scope:
      path: "_kb/**/*.md"
      type: "kb"
    values:
      layout: "wiki"
  - scope:
      path: _docs
    values:
      #layout: docs
      layout: post
  - scope:
      path: "images"
    values:
      image: true
#  - scope:
#      path: "_notes"
#      type: "drops" # a collection in your site, in plural form
#    values:
#      layout: post
  - scope:
      path: _posts
      # The 'post' type has become 'posts'.
    values:
      layout: post
  #- scope:
      #path: ''
    #values:
      #image: "/img/jekyll-og.png"

