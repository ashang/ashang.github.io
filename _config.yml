  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji # allow emoji in your post
  #- rouge

default_linked_docs_version: latest

# Used › default.html front-matter and compress.html
# Options › http://jch.penibelst.de
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  profile: false
  ignore:
    envs: [development]

