collections:
  notes:
    # Default is "/:path/"
    #permalink: "/:path/"
    output: true
  posts:
    #permalink: "/:path/"
    output: true

# default layouts for each page type
defaults:
  - scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "_notes"
      type: "posts"
    values:
      #layout: post
      category: "ramblings"
  - scope:
      path: _posts
      # The 'post' type has become 'posts'.
      type: posts
    values:
      layout: page
      category: "journal"
