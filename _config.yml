collections:
  notes:
    # Default is "/:path/"
    #permalink: "/:path/"
    output: true
  posts:
    #permalink: "/:path/"

  wiki:
    output: true
    permalink: /wiki/:path/

# types available are pages, posts, drafts or any collection
defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      # The 'post' type has become 'posts'.
    values:
      layout: "default"

  - scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "_notes"
      type: "notes" # a collection in your site, in plural form
    values:
      layout: post
      category: "ramblings"
  - scope:
      path: _posts
      type: posts
    values:
      layout: post
      category: "journal"
