# Build settings
#source: DIR

# If you want more debug log, you can set true
# debug: false

disable_disk_cache: true

## Markdown Processors
#markdown: redcarpet
#markdown: kramdown
#incremental         : false
#quiet               : false
#verbose             : false
#pygments: true
lsi:  false # don't produce an index for related posts
safe: false # disables plugins

kramdown:
  #auto_ids          : true
  #toc_levels        : [1, 2, 3, 4, 5, 6]
  #hard_wrap         : false
  #footnote_nr       : 1
  #header_offset: 2
  #show_warnings     : false
  input: GFM
  auto_ids: false
  #syntax_highlighter: coderay
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    #line_numbers: table
    #bold_every: 5
    default_lang: plaintext
    span:
      disable: true
  #entity_output     : as_char
  entity_output: numeric
  #smart_quotes      : lsquo,rsquo,ldquo,rdquo
  smart_quotes: [apos, apos, quot, quot]
  typographic_symbols:
    ndash: --

#highlighter: rouge
#highlighter: none

encoding      : utf-8
destination   : _site
lang          : 'en'             # The language setting is used in /includes/header.html for html-settings
#markdown_ext        : "markdown,mkdown,mkdn,mkd,md"
#strict_front_matter : false
strict_front_matter: true

# Filtering Content
show_drafts         : null
limit_posts         : 0
#future              : false
future: true
#unpublished         : false

liquid:
  ##error_mode        : lax
  #strict_filters    : false
  #strict_variables  : false
##Do note that while error_mode configures Liquid’s parser, the strict_variables and strict_filters options configure Liquid’s renderer and are consequently orthogonal.
  #error_mode        : warn
  error_mode        : warn
  #error_mode: strict
########
  #strict_variables: true
#render_with_liquid: "false"
#######


## Markdown Processors
