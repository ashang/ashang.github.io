# Site settings
email: aaron@ashang.org
author: aaron
heading:
subheading: ""
banner: ""
title:

# Below the site title
tagline: Tales

# Site logo
logo:

# The subpath of your site, if you want to host your path on a subpath like on GitHub Pages. e.g. /blog
baseurl:

sass:
  sass_dir: _sass

# Site navigation - each item must have a title and a url.
navigation:
- text: Home
  url: /
#- text: About
#  url: /about/
#- text: Archive
#  url: /archive/

# Social links in the site footer
github_username: "username"
medium_username: "@username"
#codepen_username: "username"
#linkedin_username: "username"

permalink_defaults:
#[permalinks]
#	page: "/:title/"
#	about: "/:filename/"
permalink: /:collection/:title/

# Copyright setting
# You can use any html code, currently below placeholders are available:
# * current year: {currentYear}
# * author: {author} (Value is the same as site.author)
# * copyright: (c) - ©
# * copyleft: (cleft)
# * sound recording copyright: (p) - ℗
#
# For example:
#   "Copyright (c) 2017-{currentYear} <a href="https://example.com">{author}</a>"
#   "Copyright © 2017-2021 Foobar"
# copyright: "Unpublished Work (cleft) 2017-{currentYear} {author}"

description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.

baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. https://example.com
favicon: "" # the favicon for your site

