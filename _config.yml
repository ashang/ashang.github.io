# Build settings
#markdown: kramdown
kramdown:
  input: GFM
  auto_ids: false
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext
    span:
      disable: true
  entity_output: numeric
  smart_quotes: [apos, apos, quot, quot]
  typographic_symbols:
    ndash: --

mathjax: true
#highlighter: rouge
#highlighter: none
#quiet: false

#pygments: true
lsi:  false # don't produce an index for related posts
safe: false # disables plugins


# Gems
plugins:
  #- jekyll-feed
  #- jekyll-seo-tag
  - jekyll-sitemap
  - jemoji # allow emoji in your post

## Disqus (Set to your disqus id)
#disqus:         jekyll-tale

# Page default value
# defaults:
#   home:
#     heading: "Your awesome heading"
#     subheading: "Your awesome subheading"
#     banner: "Your image url"

#defaults            : []
defaults:
  #- scope:
      #path: '' # an empty string here means all files in the project
      #type: "notes" # a collection in your site, in plural form
    #values:
      #type: "notes" # a collection in your site, in plural form
      #image: "/img/jekyll-og.png"
  - scope:
      path: '' # an empty string here means all files in the project
    values:
      # so as not to add layout to each file
      layout: page
      type: pages
  -
    scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "_notes"
      type: "notes" # a collection in your site, in plural form
    values:
      layout: post
  - scope:
      path: "_note"
      type: "notes" # a collection in your site, in plural form
    values:
      layout: post
  - scope:
      path: "note"
      type: "notes" # a collection in your site, in plural form
    values:
      layout: post

collections:
  note:
    # Default is "/:path/", which is XXX
    #for collections, :collection is part of path
    # It's a must to explicitly set; the global setting cannot override the default
    #permalink: /:collection/:title/
    permalink: /:collection/:title/
    layout: post
    output: true

highlight          : rouge
#include            : ['.htaccess']
include:
  - _pages

# Excludes
#exclude: [ Gemfile, Gemfile.lock ]
exclude:
    - Gemfile
    - Gemfile.lock
    - LICENSE
    - INSTALL.md
    - README.md
    - .jekyll-cache/
    - .sass-cache/
    - gemfiles/
    - node_modules/
    - vendor/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Used › default.html front-matter and compress.html
# Options › http://jch.penibelst.de
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  profile: false
  ignore:
    envs: [development]

