collections:
  notes:
    output: true
  posts:
    output: true

# default layouts for each page type
defaults:
  - scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "_notes"
    values:
      layout: "post"
      category: "ramblings"
  - scope:
      path: "_posts"
      # The 'post' type has become 'posts'.
      type: "posts"
    values:
      layout: "page"
      category: "journal"
