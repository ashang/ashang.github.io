# NOTE:
#      some of the settings in this file get overwritten in later config
#      files like _prod.yml, _dev.yml, and _defaults.yml

# the docs version that is shown by default when clicking on docs links on the site
default_linked_docs_version: latest

# the language that serves as the source for the translations
src_language: en

language: en

# Build settings
#source:      www
#destination: build-dev

# don't erase these files in the output directory
keep_files: [".git", ".svn", "wiki-images", "images", "downloads"]

# Site settings
email: aaron@ashang.org
author: aaron

heading: H
subheading: "S"
banner: "B"
title:
title:          Tale <ruby>sim<rt>ops</rt></ruby> notes

# Below the site title
tagline: Tales

# Site logo
logo:

# Assets
sass:
  sass_dir: _sass
  #style:        compressed
  #style:
  # possible values: nested expanded compact compressed
  # possible values: expanded compressed --DART styles now
  # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  style: :expanded
  line_numbers: true
  # trace_selectors: true
  # debug_info: true
  # FUTURE https://github.com/jekyll/jekyll-sass-converter/issues/12
  # sourcemap: true # Produces an error

# Site navigation - each item must have a title and a url.
navigation:
- text: Home
  url: /
#- text: About
#  url: /about/
#- text: Archive
#  url: /archive/

# Social links in the site footer
github_username: "username"
medium_username: "@username"
#codepen_username: "username"
#linkedin_username: "username"

#permalink_defaults:
#[permalinks]
#	page: "/:title/"
#	about: "/:filename/"
permalink: /:title/
#permalink: pretty  # Permalink style (/YYYY/MM/DD/page-name/)
