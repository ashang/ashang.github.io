    permalink: /drop/:path/
    ##output: true

  todo:
    ##output: true
    directory: todo/
    permalink: "/:collection/:path/"

#permalink: /:slug/
#permalink: /:path/
permalink: /:title/
# pages and collections (excluding posts and drafts) don’t have time
# and categories (for pages, the above :title is equivalent to :basename),
# these aspects of the permalink style are ignored for the output.

